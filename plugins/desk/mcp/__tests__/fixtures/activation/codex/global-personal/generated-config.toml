# user-authored Codex config
model = "gpt-5.4"
approval_policy = "on-request"

# BEGIN desk activation: desk@2.1.2 mode=global-personal owner=desk-activation
[plugins."work-suite@ourostack"]
enabled = true

[plugins."desk@ourostack"]
enabled = true

[plugins."plain-language@ourostack"]
enabled = true

[plugins."ponytail-upstream@ourostack"]
enabled = true

[plugins."desk@ourostack".mcp_servers.desk]
enabled = true
default_tools_approval_mode = "prompt"

[mcp_servers.desk]
command = "node"
args = ["plugins/desk/mcp/index.js", "--activation-config", "~/.codex/desk.activation.json"]
cwd = "."
enabled = true
default_tools_approval_mode = "prompt"
# END desk activation
